[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biofeedback"
version = "0.1.0"
description = "Low-cost biofeedback prototype for hypertension self-management via paced breathing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Izukanji Sinkolongo", email = "izukanjisinkolongo@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "wfdb>=4.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
features = [
    "neurokit2>=0.2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
